name = "habitvote-auth"
main = "src/index.ts"
compatibility_date = "2024-10-23"
compatibility_flags = [ "nodejs_compat" ]

[vars]
GOOGLE_CLIENT_EMAIL = "firebase-adminsdk-fbsvc@habitvote-5f341.iam.gserviceaccount.com"
JWT_ISS = "habitvote-auth-cloudflare"
ANDROID_PACKAGE_NAME = "me.laknabil.habitvote"
# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

[[d1_databases]]
binding = "DB" # i.e. available in your Worker on env.DB
database_name = "habitvote-auth"
database_id = "1f74341a-b68d-489f-8a9e-efc5954422ab"
migrations_dir = "./drizzle"

# [ai]
# binding = "AI"

# [observability]
# enabled = true
# head_sampling_rate = 1


[[unsafe.bindings]]
name = "RATELIMIT_NEW_ACCOUNT"
type = "ratelimit"
# An identifier you define, that is unique to your Cloudflare account.
# Must be an integer.
namespace_id = "1004"

# Limit: the number of tokens allowed within a given period in a single
# Cloudflare location
# Period: the duration of the period, in seconds. Must be either 10 or 60
simple = { limit = 1, period = 60 }



[observability]
enabled = true
head_sampling_rate = 1